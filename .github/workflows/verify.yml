name: Verify

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'refactor/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CODESAGA_BUILD_SECRET_CANARY: codesaga-ci-private-build-canary
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm services:up
      - run: pnpm services:verify
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm verify
      - run: pnpm db:rehearse-restore
        timeout-minutes: 2
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - id: acceptance
        run: pnpm test:e2e --retries=0
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.acceptance.outcome == 'success' || steps.acceptance.outcome == 'failure') }}
        with:
          name: public-accessibility-${{ github.sha }}
          path: test-results/*/axe-*.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: pnpm services:down
      - run: node scripts/release-record.mjs > "$RUNNER_TEMP/codesaga-release-record.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/codesaga-release-record.json
          if-no-files-found: error
          retention-days: 14
