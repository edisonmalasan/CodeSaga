name: codesaga

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: codesaga
      POSTGRES_USER: codesaga
      POSTGRES_PASSWORD: codesaga_local_only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesaga -d codesaga"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # The latest official security release is source-only; build its pinned tag.
    build:
      context: ./minio
    image: codesaga-minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: build
    environment:
      MINIO_ROOT_USER: codesaga_local
      MINIO_ROOT_PASSWORD: codesaga_minio_local_only
      MINIO_BROWSER: "off"
    command: ["server", "/data", "--address", ":9000"]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
